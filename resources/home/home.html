<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Home</title>
    <link rel="stylesheet" href="home.css" />
  </head>
  <body>
    <header class="page-header">
      <h1 class="page-title">Tabs</h1>
      <input
        id="home-search"
        class="search-input"
        type="search"
        placeholder="Search tabs…"
        aria-label="Search tabs"
        autocomplete="off"
        spellcheck="false"
      />
    </header>

    <nav class="tab-nav" id="view-nav" role="tablist" aria-label="Tab views">
      <button class="tab-nav-item" role="tab" data-view="open" aria-selected="true">
        Open Tabs
      </button>
      <button class="tab-nav-item" role="tab" data-view="workspaces" aria-selected="false">
        Workspaces
      </button>
      <button class="tab-nav-item" role="tab" data-view="hidden" aria-selected="false">
        Hidden Tabs
      </button>
      <button class="tab-nav-item" role="tab" data-view="groups" aria-selected="false">
        Tab Groups
      </button>
      <button class="tab-nav-item" role="tab" data-view="devices" aria-selected="false">
        Other Devices
      </button>
      <button class="tab-nav-item" role="tab" data-view="closed" aria-selected="false">
        Recently Closed
      </button>
    </nav>

    <main class="panels">
      <section class="panel" data-panel="open" role="tabpanel">
        <div class="grid" id="grid-open"></div>
        <p class="empty" data-empty="open" hidden>No open tabs.</p>
      </section>

      <section class="panel" data-panel="workspaces" role="tabpanel" hidden>
        <div class="groups" id="workspaces"></div>
        <p class="empty" data-empty="workspaces" hidden>No workspaces.</p>
      </section>

      <section class="panel" data-panel="hidden" role="tabpanel" hidden>
        <div class="grid" id="grid-hidden"></div>
        <p class="empty" data-empty="hidden" hidden>No hidden tabs.</p>
      </section>

      <section class="panel" data-panel="groups" role="tabpanel" hidden>
        <div class="groups" id="groups"></div>
        <p class="empty" data-empty="groups" hidden>No tab groups.</p>
      </section>

      <section class="panel" data-panel="devices" role="tabpanel" hidden>
        <div class="groups" id="devices"></div>
        <p class="empty" data-empty="devices" hidden>No synced devices found.</p>
      </section>

      <section class="panel" data-panel="closed" role="tabpanel" hidden>
        <div class="grid" id="grid-closed"></div>
        <p class="empty" data-empty="closed" hidden>No recently closed tabs.</p>
      </section>
    </main>

    <div id="context-menu" class="context-menu" role="menu" hidden></div>

    <script type="module" src="home.mjs"></script>
  </body>
</html>
